name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: 型別檢查 / 單元測試 / 建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Firestore 模擬器需 JDK 21 以上（firebase-tools 15 起的要求）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安裝依賴
        run: npm ci

      - name: 型別檢查（functions + web）
        run: npm run typecheck

      - name: 單元測試（累犯演算法、日期視窗、工作流狀態機）
        run: npm test

      - name: 安全規則測試（Firestore 模擬器）
        run: npm run test:rules

      - name: 建置（Cloud Functions + 前端）
        run: npm run build
